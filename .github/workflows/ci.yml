# Unit tests and a debug build on every PR and every push to main (decision 67).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tests and debug build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/android-setup
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Unit tests
        run: ./gradlew --stacktrace :pocketrocket:testDebugUnitTest :terminal-emulator:testDebugUnitTest :app:testDebugUnitTest

      - name: Debug build
        run: ./gradlew --stacktrace :app:assembleDebug

      - name: Upload the debug arm64 APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pocketrocket-debug-arm64
          path: app/build/outputs/apk/debug/termux-app_apt-android-7-debug_arm64-v8a.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            */build/reports/tests/
            */build/test-results/
          if-no-files-found: ignore
          retention-days: 14
