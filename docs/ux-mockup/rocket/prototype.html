<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rocket prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root {
  --flame: #FF8A3D; --flame-deep: #F0561E; --amber: #F5B83D; --blue: #7AB4FF; --green: #5BD69A; --red: #FF6B6B;
  --text: #F2F4F8; --soft: #C3CAD6; --muted: #8C95A5; --line: rgba(255,255,255,.09); --glass: rgba(17,20,27,.84);
  --sans: Inter, system-ui, -apple-system, Roboto, sans-serif; --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body { background: #090B10; color: var(--text); font-family: var(--sans); font-size: 15px; line-height: 1.45; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--flame); outline-offset: 2px; }
svg { display: block; }
[hidden] { display: none !important; }

.stage { min-height: 100%; display: flex; align-items: center; justify-content: center; gap: 72px; padding: 24px; }
.phone-wrap { flex: none; }
.phone { position: relative; width: 390px; height: 820px; transform-origin: top left; }
.frame { position: absolute; inset: 0; border-radius: 54px; background: #000; padding: 9px; box-shadow: 0 0 0 1.5px #2b2f38, 0 40px 90px rgba(0,0,0,.65); }
.side { position: absolute; right: -5px; top: 190px; width: 5px; height: 76px; border-radius: 0 4px 4px 0; background: #343943; transition: background .15s; }
.side:hover { background: var(--flame); }
.side-label { position: absolute; right: -96px; top: 214px; font-size: 12px; color: var(--muted); width: 84px; pointer-events: none; }
.screen { position: relative; width: 100%; height: 100%; border-radius: 45px; overflow: clip; isolation: isolate;
  background: radial-gradient(120% 60% at 85% 100%, rgba(240,86,30,.5), transparent 62%), radial-gradient(90% 55% at 5% 0%, #1B3F73, transparent 70%), #081226; }
.bar { position: absolute; z-index: 30; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; padding: 16px 28px 0; font-size: 13px; font-weight: 500; }
.bar-right { display: flex; align-items: center; gap: 8px; }
.mic-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); opacity: 0; transition: opacity .2s; }
.mic-dot.on { opacity: 1; }
.camera { position: absolute; z-index: 31; top: 14px; left: 50%; width: 15px; height: 15px; margin-left: -7px; border-radius: 50%; background: #000; }

/* lock */
.lock { position: absolute; inset: 0; padding: 74px 16px 26px; display: flex; flex-direction: column; }
.big-clock { font-weight: 300; font-size: 92px; line-height: .98; letter-spacing: -.03em; padding-left: 12px; font-variant-numeric: tabular-nums; }
.date { padding: 12px 14px 22px; font-size: 15px; font-weight: 500; color: var(--soft); }
.notes { display: grid; gap: 8px; }
.note { background: var(--glass); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border-radius: 22px; padding: 13px 14px; }
.note-row { display: flex; align-items: center; gap: 11px; }
.mark { flex: none; width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; background: #0B1E3A; color: var(--flame); }
.mark svg { width: 21px; height: 21px; }
.note-body { flex: 1; min-width: 0; }
.note-title { font-size: 14px; font-weight: 600; }
.note-text { font-size: 13px; color: var(--soft); }
.round-mic { flex: none; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(150deg, var(--flame), var(--flame-deep)); color: #1A0D04; box-shadow: 0 6px 18px rgba(240,86,30,.45); transition: transform .12s; }
.round-mic:hover { transform: scale(1.06); }
.round-mic svg { width: 21px; height: 21px; }
.note.ask { background: rgba(58,44,14,.88); }
.note.ask .note-title { color: var(--amber); }
.hint { margin-top: auto; text-align: center; font-size: 12.5px; color: var(--soft); opacity: .85; }

/* home */
.home { position: absolute; inset: 0; padding: 92px 24px 30px; display: flex; flex-direction: column; }
.glance { font-size: 24px; font-weight: 500; }
.glance small { display: block; font-size: 14px; color: var(--soft); font-weight: 400; margin-top: 3px; }
.dock { margin-top: auto; display: flex; justify-content: space-between; }
.app { width: 60px; height: 60px; border-radius: 50%; background: rgba(255,255,255,.13); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); display: grid; place-items: center; color: var(--text); }
.app svg { width: 25px; height: 25px; }
.bubble { position: absolute; right: 22px; bottom: 116px; width: 60px; height: 60px; }
.bubble .round-mic { width: 60px; height: 60px; }
.bubble .round-mic svg { width: 26px; height: 26px; }

/* heads-up */
.banner { position: absolute; z-index: 25; top: 44px; left: 12px; right: 12px; transform: translateY(-260%); transition: transform .32s cubic-bezier(.2,.9,.3,1); }
.banner.show { transform: none; }
.banner .note { width: 100%; text-align: left; background: rgba(46,20,20,.96); }
.banner .note-title { color: var(--red); }

/* assistant */
.scrim { position: absolute; z-index: 10; inset: 0; background: rgba(4,6,10,.55); opacity: 0; pointer-events: none; transition: opacity .25s; }
.scrim.show { opacity: 1; pointer-events: auto; }
.sheet { position: absolute; z-index: 20; left: 8px; right: 8px; bottom: 8px; max-height: 84%; display: flex; flex-direction: column; background: var(--glass); backdrop-filter: blur(34px) saturate(140%); -webkit-backdrop-filter: blur(34px) saturate(140%); border: 1px solid var(--line); border-radius: 38px; transform: translateY(112%); transition: transform .36s cubic-bezier(.2,.9,.25,1); }
.sheet.show { transform: none; }
.sheet-top { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px 4px; flex: none; }
.who { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; }
.who svg { width: 18px; height: 18px; color: var(--flame); }
.close { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; color: var(--soft); background: rgba(255,255,255,.08); }
.close svg { width: 15px; height: 15px; }
.talk { padding: 8px 22px 6px; overflow-y: auto; min-height: 0; display: grid; gap: 8px; }
.you { font-size: 15px; color: var(--muted); min-height: 21px; }
.reply { font-size: 22px; line-height: 1.26; font-weight: 500; letter-spacing: -.012em; text-wrap: pretty; }
.reply code, .ask-cmd { font-family: var(--mono); }
.reply code { font-size: 18px; color: var(--flame); }

.card { background: rgba(255,255,255,.06); border-radius: 20px; overflow: hidden; margin-top: 6px; }
.s-row { display: flex; align-items: center; gap: 11px; width: 100%; text-align: left; padding: 11px 14px; }
.s-row + .s-row { border-top: 1px solid var(--line); }
.s-icon { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.needs .s-icon { background: var(--amber); box-shadow: 0 0 0 4px rgba(245,184,61,.2); }
.working .s-icon { background: var(--blue); animation: breathe 1.5s ease-in-out infinite; }
.done .s-icon { background: var(--green); }
.error .s-icon { background: var(--red); box-shadow: 0 0 0 4px rgba(255,107,107,.2); }
@keyframes breathe { 50% { opacity: .3; } }
.s-name { flex: 1; min-width: 0; font-size: 14.5px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.s-state { font-size: 13px; color: var(--muted); }
.needs .s-state { color: var(--amber); font-weight: 600; }
.working .s-state { color: var(--blue); }
.done .s-state { color: var(--green); }
.error .s-state { color: var(--red); font-weight: 600; }
.ask-box { padding: 14px; display: grid; gap: 10px; }
.ask-label { font-size: 13px; color: var(--soft); }
.ask-cmd { font-size: 14px; background: rgba(0,0,0,.42); border-radius: 12px; padding: 10px 12px; overflow-wrap: anywhere; }
.ask-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.btn { border-radius: 14px; padding: 12px; font-size: 14.5px; font-weight: 600; text-align: center; background: rgba(255,255,255,.1); }
.btn:hover { background: rgba(255,255,255,.16); }
.btn.go { background: var(--flame); color: #1A0D04; }
.btn.go:hover { background: #FF9A57; }

.chips:empty { display: none; }
.chips { display: flex; gap: 7px; overflow-x: auto; padding: 10px 18px 2px; flex: none; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; font-size: 13px; font-weight: 500; border: 1px solid var(--line); background: rgba(255,255,255,.05); border-radius: 999px; padding: 7px 13px; }
.chip:hover { background: rgba(255,255,255,.12); }

.mic-zone { position: relative; flex: none; display: grid; justify-items: center; gap: 8px; padding: 14px 0 18px; }
.orb { position: absolute; top: 2px; width: 92px; height: 92px; border-radius: 50%; background: radial-gradient(circle, rgba(255,138,61,.6), rgba(240,86,30,0) 68%); opacity: .45; transition: opacity .25s, transform .25s; pointer-events: none; }
.mic-btn { position: relative; width: 66px; height: 66px; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(150deg, var(--flame), var(--flame-deep)); color: #1A0D04; box-shadow: 0 8px 26px rgba(240,86,30,.4); transition: transform .12s; }
.mic-btn:hover { transform: scale(1.04); }
.mic-btn svg { width: 29px; height: 29px; }
.mic-state { position: relative; font-size: 13px; color: var(--soft); min-height: 19px; }
.listening .orb { opacity: 1; animation: listen 1.1s ease-in-out infinite; }
.speaking .orb { opacity: .85; animation: listen .7s ease-in-out infinite; }
.thinking .orb { opacity: .7; animation: think 1.3s linear infinite; }
.listening .mic-btn { background: #fff; color: var(--flame-deep); }
@keyframes listen { 50% { transform: scale(1.5); } }
@keyframes think { 50% { transform: scale(1.18); opacity: .35; } }

.print { position: absolute; z-index: 28; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding: 0 28px 58px; gap: 18px; background: rgba(4,6,10,.8); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); text-align: center; }
.print h3 { margin: 0; font-size: 19px; font-weight: 500; }
.print code { font-family: var(--mono); color: var(--flame); font-size: 15px; display: block; margin-top: 6px; }
.sensor { width: 84px; height: 84px; border-radius: 50%; display: grid; place-items: center; color: var(--flame); border: 2px solid rgba(255,138,61,.8); animation: pulse 1.5s ease-out infinite; }
.sensor svg { width: 44px; height: 44px; }
.print small { color: var(--soft); font-size: 13px; }
.print .cancel { color: var(--muted); font-size: 13px; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255,138,61,.5); } 100% { box-shadow: 0 0 0 24px rgba(255,138,61,0); } }

/* inside the app: same look as docs/ux-mockup */
.appv { position: absolute; inset: 0; background: #0F1218; display: flex; flex-direction: column; padding-top: 42px; z-index: 5; font-size: 14px; }
.a-head { padding: 12px 20px 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; flex: none; }
.a-title { font-size: 22px; font-weight: 700; letter-spacing: -.3px; }
.a-pill { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #9AA3B2; background: #181C24; border: 1px solid #2A303C; border-radius: 999px; padding: 5px 10px; }
.pdot { width: 7px; height: 7px; border-radius: 50%; }
.a-body { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 20px 24px; display: flex; flex-direction: column; gap: 18px; scrollbar-width: none; }
.a-body::-webkit-scrollbar { display: none; }
.a-body.fabbed { padding-bottom: 150px; }
.group { display: grid; gap: 8px; }
.g-path { font-family: var(--mono); font-size: 12.5px; color: #C9CFDA; }
.s-card { display: grid; gap: 5px; width: 100%; text-align: left; padding: 13px 15px; border-radius: 14px; background: #161A22; border: 1px solid #232833; }
.s-card:hover { background: #1B2029; }
.s-card.needs { border-color: #5A4520; }
.s-card.error { border-color: #5A2A30; }
.c-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.c-title { font-size: 14px; font-weight: 600; }
.st-chip { display: inline-flex; align-items: center; gap: 5px; flex: none; font-size: 10.5px; font-weight: 600; padding: 3px 8px; border-radius: 999px; }
.st-chip i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.st-chip.needs { color: #F5B83D; background: rgba(245,184,61,.14); }
.st-chip.working { color: #7AB4FF; background: rgba(122,180,255,.12); }
.st-chip.done { color: #5BD69A; background: rgba(91,214,154,.12); }
.st-chip.error { color: #FF6B6B; background: rgba(255,107,107,.12); }
.c-where { font-size: 11px; color: #9AA3B2; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.c-where span:first-child { font-family: var(--mono); }
.via { font-size: 10.5px; font-weight: 600; color: var(--flame); background: rgba(255,138,61,.13); border-radius: 5px; padding: 1px 6px; display: inline-flex; gap: 4px; align-items: center; }
.via svg { width: 11px; height: 11px; }
.c-last { font-size: 12px; color: #B4BBC8; }
.fabs { position: absolute; right: 18px; bottom: 90px; display: flex; flex-direction: column; align-items: flex-end; gap: 12px; z-index: 2; pointer-events: none; }
.fabs > * { pointer-events: auto; }
.rocket-fab { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: #1B2029; border: 1.5px solid var(--flame); color: var(--flame); box-shadow: 0 0 22px rgba(255,138,61,.28); }
.rocket-fab:hover { background: #252B36; }
.rocket-fab svg { width: 26px; height: 26px; }
.new-fab { display: flex; align-items: center; gap: 8px; background: #FF8A3D; color: #1A1206; font-weight: 600; font-size: 14px; padding: 15px 18px; border-radius: 16px; }
.nav { flex: none; height: 76px; background: #141821; border-top: 1px solid #2A303C; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; align-items: center; font-size: 11px; color: #9AA3B2; padding-bottom: 6px; }
.nav button { display: grid; justify-items: center; gap: 4px; }
.nav button.on { color: #FF8A3D; }
.nav svg { width: 20px; height: 20px; }

.t-head { display: flex; align-items: center; gap: 6px; padding: 6px 12px 8px; flex: none; }
.t-back { width: 38px; height: 38px; display: grid; place-items: center; flex: none; }
.t-back svg { width: 22px; height: 22px; }
.t-name { flex: 1; min-width: 0; }
.t-name b { display: block; font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.t-name span { font-size: 12px; color: #9AA3B2; }
.t-rocket { width: 40px; height: 40px; flex: none; border-radius: 50%; display: grid; place-items: center; color: var(--flame); border: 1.5px solid var(--flame); box-shadow: 0 0 14px rgba(255,138,61,.22); }
.t-rocket svg { width: 21px; height: 21px; }
.t-tabs { display: flex; gap: 7px; padding: 0 12px 10px; border-bottom: 1px solid #2A303C; overflow-x: auto; flex: none; scrollbar-width: none; }
.t-tab { display: flex; align-items: center; gap: 6px; padding: 7px 11px; border-radius: 10px; border: 1px solid #2A303C; font-size: 12.5px; color: #C9CFDA; white-space: nowrap; flex: none; }
.t-tab.on { background: #20252F; color: #E8EAF0; font-weight: 600; }
.t-tab.needs { border-color: #F5B83D; }
.chat { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 9px; scrollbar-width: none; }
.chat::-webkit-scrollbar { display: none; }
.m-user { align-self: flex-end; max-width: 84%; background: #263048; padding: 9px 13px; border-radius: 16px 16px 4px 16px; font-size: 13.5px; }
.m-tag { align-self: flex-end; margin-top: -4px; }
.m-claude { font-size: 13.5px; color: #DCE0E8; }
.m-tool { display: flex; gap: 9px; align-items: center; background: #181C24; border: 1px solid #2A303C; border-radius: 12px; padding: 9px 11px; font-family: var(--mono); font-size: 12px; }
.m-tool em { color: #9AA3B2; font-style: normal; }
.m-tool span:last-child { margin-left: auto; color: #5BD69A; }
.m-verdict { align-self: center; display: inline-flex; gap: 5px; align-items: center; font-size: 11.5px; color: #9AA3B2; }
.m-verdict svg { width: 12px; height: 12px; color: var(--flame); }
.m-error { background: rgba(255,107,107,.1); border: 1px solid #5A2A30; border-radius: 12px; padding: 10px 12px; font-size: 13px; color: #FFB3B3; }
.perm { background: #2A2416; border: 1.5px solid #F5B83D; border-radius: 16px; padding: 13px; display: grid; gap: 9px; }
.perm b { font-size: 13.5px; font-weight: 600; }
.perm code { background: #0F1218; border-radius: 8px; padding: 9px 11px; font-family: var(--mono); font-size: 12.5px; overflow-wrap: anywhere; }
.perm-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.perm-btns button { height: 42px; border-radius: 12px; border: 1px solid #5A5030; font-size: 14px; }
.perm-btns .ok { border: 0; background: #F5B83D; color: #1A1206; font-weight: 600; }
.perm .always { height: 38px; border-radius: 12px; border: 1px solid #5A5030; color: #F5D48A; font-size: 12.5px; }
.composer-row { flex: none; padding: 8px 12px 16px; border-top: 1px solid #2A303C; background: #141821; display: grid; gap: 7px; }
.c-row { display: flex; align-items: center; gap: 8px; }
.c-slash { width: 42px; height: 42px; flex: none; border-radius: 50%; border: 1px solid #2A303C; color: #C9CFDA; font-family: var(--mono); font-size: 17px; }
.c-input { flex: 1; min-width: 0; height: 42px; border-radius: 21px; border: 1px solid #2A303C; background: #0F1218; color: #9AA3B2; padding: 0 15px; display: flex; align-items: center; font-size: 13.5px; }
.c-dict { width: 42px; height: 42px; flex: none; border-radius: 50%; background: #FF8A3D; color: #1A1206; display: grid; place-items: center; }
.c-dict svg { width: 20px; height: 20px; }
.c-line { font-family: var(--mono); font-size: 11px; color: #9AA3B2; padding: 0 4px; }

.sec { display: grid; gap: 8px; }
.sec-t { font-size: 11px; font-weight: 600; color: #9AA3B2; letter-spacing: .5px; }
.set-card { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 13px; border-radius: 14px; background: #161A22; border: 1px solid #232833; }
.set-card:hover { background: #1B2029; }
.set-card.hot { border-color: var(--flame); background: #1E1A16; }
.tile2 { width: 36px; height: 36px; flex: none; border-radius: 10px; display: grid; place-items: center; font-size: 15px; font-weight: 700; background: #232833; }
.tile2.flame { background: rgba(255,138,61,.14); color: #FF8A3D; }
.tile2 svg { width: 20px; height: 20px; }
.set-text { flex: 1; min-width: 0; display: grid; gap: 1px; }
.set-text b { font-size: 14px; font-weight: 600; }
.set-text span { font-size: 12px; color: #9AA3B2; }
.chev { color: #9AA3B2; font-size: 12px; }
.rows { display: grid; }
.set-row { display: flex; justify-content: space-between; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 12px 2px; border-bottom: 1px solid #1E232D; min-height: 48px; }
.set-row:last-child { border-bottom: 0; }
.set-row .r-text { min-width: 0; display: grid; gap: 1px; font-size: 14px; }
.set-row small { font-size: 12px; color: #9AA3B2; }
.set-row .val { color: #9AA3B2; font-size: 13px; flex: none; text-align: right; }
.switch { position: relative; flex: none; width: 42px; height: 25px; border-radius: 999px; background: #2A303C; transition: background .15s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 19px; height: 19px; border-radius: 50%; background: #E8EAF0; transition: transform .15s; }
.switch.on { background: var(--flame); }
.switch.on::after { transform: translateX(17px); background: #1A1206; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 3px; border-radius: 11px; background: #161A22; border: 1px solid #232833; }
.seg button { padding: 7px 4px; border-radius: 8px; font-size: 12.5px; color: #C9CFDA; }
.seg button.on { background: #E8EAF0; color: #0F1218; font-weight: 600; }
.try { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 14px; border-radius: 16px; background: linear-gradient(120deg, rgba(255,138,61,.2), rgba(240,86,30,.06)); border: 1px solid rgba(255,138,61,.45); }
.try .round-mic { width: 46px; height: 46px; pointer-events: none; }
.log-row { display: grid; grid-template-columns: 44px 1fr; gap: 10px; padding: 12px 2px; border-bottom: 1px solid #1E232D; }
.log-row:last-child { border-bottom: 0; }
.log-time { font-family: var(--mono); font-size: 12px; color: #9AA3B2; padding-top: 1px; }
.log-text { font-size: 13.5px; }
.log-text code { font-family: var(--mono); font-size: 12.5px; color: var(--flame); }
.log-text small { display: block; font-size: 12px; color: #9AA3B2; margin-top: 1px; }
.pr-app { color: var(--flame); background: rgba(11,30,58,.9); border: 1.5px solid var(--flame); }
.who small { color: var(--muted); font-size: 12.5px; font-weight: 400; }

function drawApp() {

function mode(m, text) {

function show(reply, card = '') {

/* speech out */
let voice = null;
function pickVoice() {
  if (!('speechSynthesis' in window)) return;
  const all = speechSynthesis.getVoices().filter(v => v.lang.startsWith('en'));
  voice = all.find(v => /Google UK English Female|Samantha|Google US English/.test(v.name)) || all[0] || null;
}
if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(text) {
  const plain = text.replace(/<[^>]+>/g, '');
  const quiet = 500 + plain.split(' ').length * 240;
  return new Promise(resolve => {
    let over = false;
    const end = () => { if (!over) { over = true; resolve(); } };
    if (!S.sound || !('speechSynthesis' in window)) { setTimeout(end, Math.min(quiet, 1200)); return; }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(plain);
    if (voice) u.voice = voice;
    u.rate = 1.05;
    u.onend = end; u.onerror = end;
    setTimeout(end, quiet + 2500);
    speechSynthesis.speak(u);
  });
}
let turn = 0;
async function say(reply, card = '', opts = {}) {
  const mine = ++turn;
  show(reply, card);
  mode('speaking', 'Speaking');
  await speak(opts.speak || reply);
  if (mine !== turn || !S.open) return;
  if (opts.listenAfter && S.voice) listen();
  else idle();
}
function idle() { mode('', 'Tap to talk'); }

/* speech in */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
function stopRec() { if (rec) { rec.onend = null; rec.onresult = null; rec.onerror = null; try { rec.abort(); } catch (e) {} rec = null; } }
function warn(text) { $('alert').textContent = text; $('alert').hidden = !text; }
function listen() {
  stopRec();
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  turn++;
  if (!SR) { warn('This browser has no speech recognition. Use Chrome, or tap the suggestions on the phone.'); idle(); return; }
  warn('');
  rec = new SR();
  rec.lang = navigator.language || 'en-US'; rec.interimResults = true; rec.continuous = false;
  let heard = '';
  rec.onresult = e => {
    heard = [...e.results].map(r => r[0].transcript).join('');
    $('you').textContent = heard;
    const tb = $('typeBox'); if (tb) tb.placeholder = heard;
    if (e.results[e.results.length - 1].isFinal) { stopRec(); handle(heard, true); }
  };
  rec.onerror = e => {
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') warn('The browser blocked the mic. Allow it in the address bar, or tap the suggestions on the phone.');
    else if (e.error === 'network') warn('Speech recognition needs internet in this browser.');
    stopRec(); idle();
  };
  rec.onend = () => { rec = null; idle(); resumeWake(); };
  rec.start();
  mode('listening', 'Listening');
}
document.addEventListener('keydown', e => {
  if (e.target.id === 'typeBox' && e.key === 'Enter' && e.target.value.trim()) { const v = e.target.value.trim(); e.target.value = ''; stopRec(); handle(v, false); }
});
function resumeWake() {
  if (!S.wake || S.open || rec || !SR) return;
  rec = new SR();
  rec.lang = navigator.language || 'en-US'; rec.continuous = true; rec.interimResults = true;
  rec.onresult = e => {
    const t = [...e.results].slice(e.resultIndex).map(r => r[0].transcript).join(' ').toLowerCase();
    if (/rocket/.test(t)) { stopRec(); open(true); }
  };
  rec.onerror = e => { if (e.error === 'not-allowed') { S.wake = false; syncTools(); warn('The browser blocked the mic. Allow it in the address bar.'); } };
  rec.onend = () => { rec = null; setTimeout(resumeWake, 250); };
  rec.start();
}

/* opening and closing */
function open(thenListen, keep) {
  if (onTab()) { if (thenListen) { S.voice = true; listen(); } return; }
  S.open = true;
  $('sheet').classList.add('show'); $('scrim').classList.add('show');
  $('banner').classList.remove('show');
  complete('wake');
  if (S.view && !S.locked) complete('a_rocket');
  const ctx = S.view === 'session' && !S.locked ? S.sessions.find(i => i.id === S.sessionId) : null;
  $('whoCtx').textContent = ctx ? `· ${ctx.id}` : '';
  if (!keep) { $('you').textContent = ''; show('How can I help?'); S.awaiting = null; defaultChips(); idle(); }
  if (thenListen) { S.voice = true; listen(); }
}
function close() {
  S.open = false; turn++; stopRec();
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  $('sheet').classList.remove('show'); $('scrim').classList.remove('show');
  $('print').hidden = true; S.awaiting = null;
  mode('', ''); S.open = onTab(); resumeWake();
}

/* what you said */
const has = (t, re) => re.test(t);
const YES = /\b(yes|yeah|yep|confirm|sure|go ahead|do it|ok|okay)\b/;
const NO = /\b(no|nope|cancel|deny|reject|don'?t|stop)\b/;
async function handle(raw, viaVoice) {
  const t = raw.toLowerCase().trim();
  S.voice = !!viaVoice;
  $('you').textContent = raw;
  S.convo.push({ who: 'you', text: raw });
  if (onTab()) { complete('a_rocket'); drawApp(); }
  const ask = pending();

  if (S.awaiting === 'confirm' && ask) {
    if (has(t, NO)) return denied(ask);
    if (has(t, YES)) return authorize(ask);
    return say(`Allow <code>${ask.cmd}</code>? Say yes or no.`, askCard(ask), { listenAfter: true });
  }
  if (ask && has(t, /\b(allow|approve|accept)\b/)) {
    S.awaiting = 'confirm';
    chips(['Yes', 'No']);
    return say(`Allow <code>${ask.cmd}</code>? Say yes to confirm.`, askCard(ask), { listenAfter: true });
  }
  if (ask && S.awaiting === 'approval' && has(t, NO)) return denied(ask);
  if (ask && has(t, /\b(deny|reject)\b/)) return denied(ask);

  if (has(t, /(start|launch|spin up|new).*(agent|session)|run an agent/)) return startAgent(t);
  if (failed() && has(t, /\b(tell|fix|ask it|sort|unblock|retry|continue)\b/)) return fixIt(failed());
  if (!has(t, /\b(tell|fix|ask it)\b/)) {
    if (has(t, /\b(diff|changes?|changed)\b/)) return showVisual('diff', t);
    if (has(t, /\b(tests?|failing|failure|wrong|broke)\b/)) return showVisual('tests', t);
    if (has(t, /\b(page|screen ?shot|site|look like|looks)\b/)) return showVisual('page', t);
  }
  if (ask && has(t, /\bwant|waiting|need|ask|api|blocked|unblock\b/)) {
    S.awaiting = 'approval';
    chips([]);
    return say('Allow or deny?', askCard(ask), { listenAfter: true, speak: `${ask.say} wants to run ${ask.cmd}. Allow or deny?` });
  }
  if (has(t, /happening|status|going on|update|how.*(things|going)|what.*running|sessions?\b/)) {
    complete('status');
    defaultChips();
    const parts = [...S.sessions].sort((a, b) => ORDER[a.st] - ORDER[b.st]).map(s => `${s.say} ${{ needs: 'needs you', working: 'is working', done: 'is done', error: 'failed' }[s.st]}`);
    return say(`${parts.join('. ')}.`, statusCard());
  }
  const named = S.sessions.find(s => t.includes(s.id) || t.includes(s.say.toLowerCase()));
  if (named) { defaultChips(); return say(`${named.say} ${{ needs: 'needs you', working: 'is working', done: 'is done', error: 'failed. 2 tests are red' }[named.st]}.`); }
  defaultChips();
  return say('This demo only knows a few things. Try asking what\'s happening, or start an agent.');
}
const VISUALS = {
  diff: x => ({
    say: `Two files changed in ${x.say}, mostly the token refresh. Here it is.`,
    lock: 'I can show you what changed. Touch the sensor first.',
    log: `Showed what changed in ${x.id}`,
    card: `<div class="v-head"><b>src/auth/session.ts</b><span><span class="add">+12</span> <span class="del">−3</span></span></div>
      <div class="diff"><div>  async function refresh() {</div><div class="d">-   return retry(oldToken)</div><div class="a">+   const token = await renew()</div><div class="a">+   store.save(token)</div><div class="a">+   return retry(token)</div><div>  }</div></div>
      <div class="v-head"><b>src/auth/session.test.ts</b><span><span class="add">+31</span> <span class="del">−0</span></span></div>`,
  }),
  tests: x => ({
    say: `Two tests failed in ${x.say}. Both are about expired tokens.`,
    lock: 'I can show you the failing tests. Touch the sensor first.',
    log: `Showed the failing tests in ${x.id}`,
    card: `<div class="fail-row"><b>refresh › renews an expired token</b><code>expected 200, got 401 · session.test.ts:42</code></div><div class="fail-row"><b>login › second try succeeds</b><code>token was undefined · login.test.ts:18</code></div>`,
  }),
  page: x => ({
    say: `This is the checkout page from ${x.say}, at phone width.`,
    lock: 'I can show you the page. Touch the sensor first.',
    log: `Showed a screenshot from ${x.id}`,
    card: `<div class="shot-frame"><b>Checkout</b><div class="shot-line"><span>Blue mug</span><span>₹450</span></div><div class="shot-line"><span>Delivery</span><span>₹40</span></div><div class="shot-line"><span>Total</span><span>₹490</span></div><div class="shot-btn">Pay now</div></div><p class="v-note">Screenshot Claude took in its own browser</p>`,
  }),
};
function showVisual(kind, t) {
  const x = S.sessions.find(i => t.includes(i.id) || t.includes(i.say.toLowerCase())) || failed() || S.sessions.find(i => i.id === S.sessionId) || S.sessions.find(i => i.id === 'pocketrocket');
  const v = VISUALS[kind](x);
  const present = () => {
    complete('a_visual'); logIt(v.log, howNow()); defaultChips();
    say(v.say, `<div class="v-card">${v.card}<div class="v-actions"><button data-later="${v.log}">Later</button><button class="go" data-full="${x.id}">Open full</button></div></div>`);
  };
  if (!S.locked) return present();
  S.after = present;
  $('printTitle').textContent = 'Touch to see it';
  $('printCmd').textContent = x.id;
  $('print').hidden = false;
  show(v.lock);
  speak(v.lock);
}
async function authorize(ask) {
  S.awaiting = null;
  if (S.locked) {
    $('printTitle').textContent = 'Touch to allow';
    $('printCmd').textContent = ask.cmd;
    $('print').hidden = false;
    show('Touch the sensor to allow it.', '');
    mode('speaking', 'Speaking');
    await speak('Touch the sensor to allow it.');
    return;
  }
  applied(ask);
}
function applied(ask) {
  $('print').hidden = true;
  const how = S.locked && !S.voice ? 'With fingerprint' : S.locked ? 'By voice and fingerprint' : howNow();
  const viaRocket = S.open;
  logIt(`Allowed <code>${ask.cmd}</code> in ${ask.id}`, how);
  ask.log.push({ t: 'verdict', text: `Allowed ${how.toLowerCase()} · ${now()}`, rocket: viaRocket });
  ask.log.push({ t: 'tool', kind: 'Bash', path: ask.cmd });
  ask.last = `Running ${ask.cmd}`;
  S.locked = false;
  ask.st = 'working'; delete ask.cmd;
  complete('allow'); complete('a_allow');
  drawPhone(); defaultChips();
  if (viaRocket) say("Done, it's running.");
}
function denied(ask) {
  S.awaiting = null; $('print').hidden = true;
  const viaRocket = S.open;
  logIt(`Denied <code>${ask.cmd}</code> in ${ask.id}`, howNow());
  ask.log.push({ t: 'verdict', text: `Denied ${howNow().toLowerCase()} · ${now()}`, rocket: viaRocket });
  ask.last = 'Told no, looking for another way';
  ask.st = 'working'; delete ask.cmd;
  drawPhone(); defaultChips();
  if (viaRocket) say(`Denied. ${ask.say} was told no.`);
}
async function fixIt(s) {
  S.awaiting = null;
  const mine = ++turn;
  show('One moment.'); mode('thinking', 'Thinking'); chips([]);
  speak('One moment.');
  await sleep(1500);
  if (mine !== turn) return;
  s.st = 'working'; complete('told');
  s.log.push({ t: 'user', text: 'Fix the failing tests and open a PR.', via: true });
  s.last = 'Fixing the failing tests';
  logIt(`Told ${s.id} to fix the tests and open a PR`, howNow());
  drawPhone(); defaultChips();
  say(`Sent. ${s.say} is fixing the tests.`);
}
async function startAgent(t) {
  S.awaiting = null;
  const m = t.match(/\bin (?:the )?([a-z0-9-]+)/);
  const name = m ? m[1] : 'notes';
  const mine = ++turn;
  show('One moment.'); mode('thinking', 'Thinking'); chips([]);
  speak('One moment.');
  await sleep(1500);
  if (mine !== turn) return;
  const id = S.sessions.some(s => s.id === name) ? `${name}-2` : name;
  const task = (t.match(/\bto (.+)$/) || [])[1] || 'New task';
  const title = task[0].toUpperCase() + task.slice(1);
  const known = S.sessions.find(i => i.id === name);
  S.sessions.push({ id, say: name, st: 'working', title, folder: known ? known.folder : `work/${name}`, where: `${name} · main`, last: 'Reading the project', byRocket: true, log: [{ t: 'user', text: title + '.', via: true }] });
  logIt(`Started an agent in ${name}`, `${howNow()} · Manual mode`);
  complete('start'); complete('a_start'); drawPhone(); defaultChips();
  say(`Started in ${name}. I'll tell you if it needs you.`, statusCard());
}
async function makeFail() {
  const s = S.sessions.find(x => x.id === 'pocketrocket');
  s.st = 'error'; delete s.cmd;
  s.last = '2 tests are red';
  s.log.push({ t: 'error', text: 'The run stopped: 2 tests are red.' });
  if (S.prefs.errors) logIt(`Told you ${s.id} failed`, 'Announcement');
  drawPhone();
  if (S.open) { defaultChips(); return say('Pocketrocket failed. 2 tests are red.', statusCard()); }
  $('banner').classList.add('show');
  if (!S.prefs.enabled || !S.prefs.errors || S.prefs.quiet) return;
  await speak('Pocketrocket failed. 2 tests are red.');
  if (S.open || !$('banner').classList.contains('show')) return;
  S.voice = true;
  open(false);
  show('Pocketrocket failed. 2 tests are red.', statusCard());
  defaultChips();
  if (SR) listen();
}

/* wiring */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-say],[data-allow],[data-open],[data-nav],[data-session],[data-pref],[data-seg],[data-guide],[data-tap-deny],[data-wake],[data-picker],[data-picker-close],[data-account],[data-full],[data-later],[data-tab-mic],[data-quick],[data-quick-close],[data-quick-compact],[data-quick-fresh]');
  if (!b) return;
  if ('quick' in b.dataset) { S.quick = true; return drawPhone(); }
  if ('quickClose' in b.dataset) { if (e.target === b) { S.quick = false; drawPhone(); } return; }
  if ('quickFresh' in b.dataset) { S.convo = []; S.quick = false; complete('a_settings'); logIt('Started a fresh Rocket conversation', 'In quick controls'); return drawPhone(); }
  if ('quickCompact' in b.dataset) { S.quick = false; logIt("Compacted Rocket's memory", 'In quick controls'); return drawPhone(); }
  if ('tabMic' in b.dataset) { if (S.modeNow === 'listening') { stopRec(); idle(); } else { S.voice = true; listen(); } return; }
  if (b.dataset.guide) return setGuide(b.dataset.guide);
  if (b.dataset.nav) return go(b.dataset.nav);
  if (b.dataset.session) { S.sessionId = b.dataset.session; return go('session'); }
  if (b.dataset.account) { S.prefs.account = b.dataset.account; S.picker = false; complete('a_settings'); logIt(`Switched Rocket to the ${acctLabel()} login`, 'In Settings'); return drawPhone(); }
  if ('picker' in b.dataset) { S.picker = true; return drawPhone(); }
  if ('pickerClose' in b.dataset) { if (e.target === b) { S.picker = false; drawPhone(); } return; }
  if (b.dataset.full) { S.sessionId = b.dataset.full; close(); S.locked = false; return go('session'); }
  if (b.dataset.later) { logIt(`Saved for later: ${b.dataset.later}`, 'Open it from here'); return say('Saved in Activity.'); }
  if (b.dataset.pref === 'enabled' && S.prefs.enabled) { S.wake = false; stopRec(); close(); syncTools(); }
  if (b.dataset.pref) { S.prefs[b.dataset.pref] = !S.prefs[b.dataset.pref]; return drawPhone(); }
  if (b.dataset.seg) { S.prefs[b.dataset.seg] = b.dataset.val; return drawPhone(); }
  if (b.dataset.seg || b.dataset.pref) complete('a_settings');
  if ('wake' in b.dataset) { $('wakeToggle').click(); return drawPhone(); }
  if ('tapDeny' in b.dataset) { const a = pending(); if (a) { S.voice = false; denied(a); } return; }
  if (b.dataset.say) { stopRec(); handle(b.dataset.say, false); }
  else if ('allow' in b.dataset) { stopRec(); const a = pending(); if (a) { S.voice = false; authorize(a); } }
  else open(true);
});
$('micBtn').addEventListener('click', () => { if ($('micZone').classList.contains('listening')) { stopRec(); idle(); } else { S.voice = true; listen(); } });
$('side').addEventListener('click', () => { if (!S.prefs.enabled) return; if (onTab()) { S.voice = true; listen(); } else { S.open ? close() : open(true); } });
$('close').addEventListener('click', close);
$('scrim').addEventListener('click', close);
$('bannerBtn').addEventListener('click', () => { open(true); });
$('sensor').addEventListener('click', () => { if (S.after) { const f = S.after; S.after = null; $('print').hidden = true; S.locked = false; drawPhone(); f(); return; } const a = pending(); $('print').hidden = true; if (a) applied(a); });
$('printCancel').addEventListener('click', () => { $('print').hidden = true; if (S.after) { S.after = null; say('Okay, it stays hidden.'); return; } const a = pending(); S.awaiting = 'approval'; if (a) { chips([]); say('Not allowed yet. It\'s still waiting.', askCard(a)); } });
$('fail').addEventListener('click', makeFail);
$('lockBtn').addEventListener('click', () => { close(); S.guide = 'lock'; S.view = null; S.locked = true; drawSteps(); drawPhone(); });
function syncTools() { $('wakeToggle').setAttribute('aria-pressed', S.wake); $('soundToggle').setAttribute('aria-pressed', S.sound); mode($('micZone').className.replace('mic-zone', '').trim(), $('micState').textContent); }
$('wakeToggle').addEventListener('click', () => {
  if (!SR) { warn('This browser has no speech recognition. Use Chrome.'); return; }
  if (!S.prefs.enabled) { warn('Turn the assistant on first, in Settings › Assistant.'); return; }
  S.wake = !S.wake; syncTools();
  if (S.wake) { if (!S.open) { stopRec(); resumeWake(); } } else if (!S.open) stopRec();
});
$('soundToggle').addEventListener('click', () => { S.sound = !S.sound; syncTools(); if (!S.sound && 'speechSynthesis' in window) speechSynthesis.cancel(); });
$('reset').addEventListener('click', () => {
  close(); S.sessions = freshSessions(); S.done.clear(); S.prefs = freshPrefs(); S.locked = S.guide === 'lock'; S.view = S.guide === 'app' ? firstView() : null; S.convo = []; S.open = onTab(); if (S.open) defaultChips(); warn('');
  $('banner').classList.remove('show'); drawPhone(); drawSteps();
});

function fit() {
  const small = innerWidth <= 860;
  const scale = Math.min(1, (innerHeight - 48) / 820, small ? (innerWidth - 40) / 390 : 1);
  $('phone').style.transform = `scale(${scale})`;
  $('phoneWrap').style.width = `${390 * scale}px`;
  $('phoneWrap').style.height = `${820 * scale}px`;
}
addEventListener('resize', fit);
fit(); drawClock(); setInterval(drawClock, 15000); drawPhone(); drawSteps();

/* Screenshot states, used only to check the look: index.html#status and so on. */
(async () => {
  const h = location.hash.slice(1);
  if (!h) return;
  S.sound = false;
  const inApp = { rocket: 'rocket', app: 'sessions', chatview: 'session', settings: 'settings', assistant: 'assistant', activity: 'activity' }[h];
  if (inApp) { S.guide = 'app'; S.locked = false; S.sessionId = 'api-server'; go(inApp); drawSteps(); }
  if (h === 'quick') { S.guide = 'app'; S.locked = false; go('rocket'); S.quick = true; drawSteps(); drawPhone(); }
  if (h === 'rtalk') { S.guide = 'app'; S.locked = false; go('rocket'); drawSteps(); handle("What's happening?"); await sleep(1300); handle('Show what changed in pocketrocket'); }
  if (h === 'diff' || h === 'page') { S.guide = 'app'; S.locked = false; S.sessionId = 'pocketrocket'; go('session'); drawSteps(); open(false); handle(h === 'diff' ? 'Show what changed' : 'Show the page'); }
  if (h === 'acct') { S.guide = 'app'; S.locked = false; S.picker = true; go('assistant'); drawSteps(); }
  if (h === 'off') { S.guide = 'app'; S.locked = false; S.prefs.enabled = false; go('assistant'); drawSteps(); }
  if (h === 'appsheet') { S.guide = 'app'; S.locked = false; S.sessionId = 'api-server'; go('session'); drawSteps(); open(false); handle('Allow'); }
  if (h === 'status') { open(false); handle("What's happening?"); }
  if (h === 'ask') { open(false); handle('What does API server want?'); }
  if (h === 'print') { open(false); handle('What does API server want?'); await sleep(100); handle('Allow'); await sleep(100); handle('Yes'); }
  if (h === 'home') { open(false); handle('What does API server want?'); await sleep(100); authorize(pending()); await sleep(100); $('sensor').click(); await sleep(1400); close(); }
})();
