<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Claude login picker</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #07090E; color: #E8EAF0; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden">
  <div style="display: flex; flex-direction: column; gap: 10px; padding: 22px 18px 28px; border-radius: 24px 24px 0 0; background: #181C24; border-top: 1px solid #2A303C">
    <h1 style="margin: 0; font-size: 18px; font-weight: 600">Claude login for Rocket</h1>
    <p style="margin: 0 0 6px; font-size: 13px; line-height: 1.45; color: #C9CFDA">Its questions count against this login's limit. Changing it starts a fresh Rocket conversation. Your sessions aren't affected.</p>
    <button style="display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 13px; border-radius: 14px; border: 1.5px solid #FF8A3D; background: #241C17; color: #E8EAF0; font: inherit"><span style="flex: none; width: 18px; height: 18px; box-sizing: border-box; border-radius: 50%; border: 5px solid #FF8A3D"></span><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 600">Default</span><span style="font-size: 12px; color: #C9CFDA">Follows your default login: personal</span></span></button>
    <button style="display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 13px; border-radius: 14px; border: 1px solid #2A303C; background: none; color: #E8EAF0; font: inherit"><span style="flex: none; width: 18px; height: 18px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid #6A7180"></span><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 600">personal</span><span style="font-size: 12px; color: #C9CFDA">Max · [LIMIT USED]</span></span></button>
    <button style="display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 13px; border-radius: 14px; border: 1px solid #2A303C; background: none; color: #E8EAF0; font: inherit"><span style="flex: none; width: 18px; height: 18px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid #6A7180"></span><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 600">work</span><span style="font-size: 12px; color: #C9CFDA">[PLAN] · [LIMIT USED]</span></span></button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
