<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Capsule: show what changed</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#FF8A3D}a:hover{color:#FFA566}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0A1A33; color: #F2F4F8; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; justify-content: flex-end; padding: 28px 16px 28px; overflow: hidden">
  <div style="display: flex; flex-direction: column; gap: 14px; padding: 20px; border-radius: 34px; background: #F2F4F8; color: #12151C">
    <div style="font-size: 20px; line-height: 1.25; font-weight: 600; letter-spacing: -0.3px">Two files changed, mostly the token refresh.</div>
    <div style="background: #12151C; color: #E8EAF0; border-radius: 18px; overflow: hidden; font-family: 'JetBrains Mono', monospace; font-size: 12.5px; line-height: 1.7; padding-bottom: 8px">
      <div style="display: flex; justify-content: space-between; padding: 12px 14px; color: #C9CFDA"><span>src/auth/session.ts</span><span><span style="color: #5BD69A">+12</span> <span style="color: #FF8A8A">−3</span></span></div>
      <div style="padding: 0 14px; white-space: pre">  async function refresh() {</div>
      <div style="padding: 0 14px; white-space: pre; background: rgba(255,107,107,0.15); color: #FFC2C2">-   return retry(oldToken)</div>
      <div style="padding: 0 14px; white-space: pre; background: rgba(91,214,154,0.15); color: #B6F0D2">+   const token = await renew()</div>
      <div style="padding: 0 14px; white-space: pre; background: rgba(91,214,154,0.15); color: #B6F0D2">+   store.save(token)</div>
      <div style="padding: 0 14px; white-space: pre; background: rgba(91,214,154,0.15); color: #B6F0D2">+   return retry(token)</div>
      <div style="padding: 0 14px; white-space: pre">  }</div>
      <div style="display: flex; justify-content: space-between; padding: 12px 14px 4px; color: #C9CFDA"><span>session.test.ts</span><span><span style="color: #5BD69A">+31</span> <span style="color: #FF8A8A">−0</span></span></div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <button style="height: 54px; border-radius: 27px; border: 0; background: #E2E5EA; color: #12151C; font: inherit; font-size: 15px; font-weight: 600">Later</button>
      <button style="height: 54px; border-radius: 27px; border: 0; background: #12151C; color: #F2F4F8; font: inherit; font-size: 15px; font-weight: 600">Open full</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
