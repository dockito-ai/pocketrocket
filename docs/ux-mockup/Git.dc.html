<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Repo git</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0F1218; color: #E8EAF0; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 18px 12px 4px; display: flex; align-items: center; gap: 8px">
    <a href="Workspace.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
    <div style="flex: 1"><div style="font-size: 20px; font-weight: 700">app</div><div style="font-size: 12px; color: #9AA3B2">pocketrocket / app</div></div>
  </div>
  <div style="margin: 6px 18px 12px; display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 12px; background: #181C24; border: 1px solid #2A303C">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5BD69A" stroke-width="2" aria-hidden="true"><circle cx="6" cy="6" r="2.5"></circle><circle cx="6" cy="18" r="2.5"></circle><circle cx="18" cy="9" r="2.5"></circle><path d="M6 8.5v7M18 11.5c0 3-4 3-9.5 4.5"></path></svg>
    <span style="flex: 1; font-family: 'JetBrains Mono', monospace; font-size: 14px">main ▾</span>
    <span style="font-size: 12px; color: #C9CFDA">↑2 ↓0</span>
    <button style="height: 34px; padding: 0 12px; border-radius: 9px; border: 0; background: #FF8A3D; color: #1A1206; font: inherit; font-size: 13px; font-weight: 600">Push</button>
  </div>

  <div style="display: flex; gap: 4px; margin: 0 18px; padding: 4px; border-radius: 12px; background: #181C24">
    <button onClick="{{goChanges}}" style="{{tChanges}}">Changes · 3</button>
    <button onClick="{{goCommits}}" style="{{tCommits}}">Commits</button>
    <a href="Browse.dc.html" style="flex: 1; height: 38px; display: flex; align-items: center; justify-content: center; border-radius: 9px; font-size: 13px; font-weight: 600; color: #9AA3B2">Files</a>
  </div>

  <div style="flex: 1; overflow: auto; padding: 14px 18px; display: flex; flex-direction: column; gap: 6px">
    <sc-if value="{{showChanges}}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <sc-for list="{{changes}}" as="c" hint-placeholder-count="3">
          <a href="Diff.dc.html" style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 12px; background: #181C24; border: 1px solid #2A303C">
            <span style="{{c.badge}}">{{c.kind}}</span>
            <span style="flex: 1; min-width: 0; font-family: 'JetBrains Mono', monospace; font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{c.path}}</span>
            <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #5BD69A">{{c.add}}</span>
            <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #FF8F8F">{{c.del}}</span>
          </a>
        </sc-for>
        <div style="font-size: 12px; color: #9AA3B2; padding: 6px 2px">Changed by the “Fix login” session</div>
      </div>
    </sc-if>
    <sc-if value="{{showCommits}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column">
        <sc-for list="{{commits}}" as="k" hint-placeholder-count="5">
          <div style="display: flex; gap: 12px; padding: 12px 2px; border-bottom: 1px solid #20252F">
            <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #FF8A3D">{{k.sha}}</span>
            <span style="flex: 1; display: flex; flex-direction: column; gap: 3px"><span style="font-size: 14px">{{k.msg}}</span><span style="font-size: 12px; color: #9AA3B2">{{k.meta}}</span></span>
          </div>
        </sc-for>
      </div>
    </sc-if>
  </div>

  <div style="padding: 12px 18px 22px; border-top: 1px solid #2A303C; display: flex; gap: 8px">
    <a href="Session.dc.html" style="flex: 1; display: flex; align-items: center; justify-content: center; height: 48px; border-radius: 14px; background: #20252F; font-size: 14px; font-weight: 600">Ask Claude to commit</a>
    <button style="flex: 1; height: 48px; border-radius: 14px; border: 1px solid #2A303C; background: none; color: #E8EAF0; font: inherit; font-size: 14px">Commit…</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { tab: 'changes' }; }
  renderVals() {
    const t = (on) => 'flex: 1; height: 38px; border: 0; border-radius: 9px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; color: ' + (on ? '#E8EAF0' : '#9AA3B2') + '; background: ' + (on ? '#2A303C' : 'transparent');
    const badge = (col) => "width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; border-radius: 6px; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; color: " + col + '; background: #20252F';
    const ch = this.state.tab === 'changes';
    return {
      showChanges: ch, showCommits: !ch,
      goChanges: () => this.setState({ tab: 'changes' }), goCommits: () => this.setState({ tab: 'commits' }),
      tChanges: t(ch), tCommits: t(!ch),
      changes: [
        { kind: 'M', badge: badge('#F5B83D'), path: 'src/auth/session.ts', add: '+12', del: '−3' },
        { kind: 'A', badge: badge('#5BD69A'), path: 'src/auth/retry.ts', add: '+40', del: '' },
        { kind: 'M', badge: badge('#F5B83D'), path: 'test/auth.test.ts', add: '+18', del: '−1' }
      ],
      commits: [
        { sha: 'a91c2e', msg: 'Add token retry', meta: 'Claude · 20 min ago · not pushed' },
        { sha: '3be71a', msg: 'Split auth module', meta: 'Claude · 1 h ago · not pushed' },
        { sha: 'c02d9f', msg: 'Bump deps', meta: 'Shankar · yesterday' },
        { sha: '88a4e1', msg: 'Login screen polish', meta: 'Shankar · Mon' }
      ]
    };
  }
}
</script>
</body>
</html>
