<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Claude accounts</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0F1218; color: #E8EAF0; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 18px 12px 6px; display: flex; align-items: center; gap: 8px">
    <a href="Settings.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
    <div style="font-size: 17px; font-weight: 600">Claude accounts</div>
  </div>

  <div style="flex: 1; overflow: auto; padding: 10px 24px 20px; display: flex; flex-direction: column; gap: 8px">
    <sc-for list="{{accounts}}" as="a" hint-placeholder-count="3">
      <a href="ClaudeAccount.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 14px; background: #161A22; border: 1px solid #232833">
        <span style="width: 36px; height: 36px; border-radius: 18px; background: #2A303C; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600">{{a.initial}}</span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
          <span style="display: flex; align-items: center; gap: 8px"><span style="font-size: 15px; font-weight: 600">{{a.name}}</span><sc-if value="{{a.isDefault}}" hint-placeholder-val="{{ false }}"><span style="font-size: 10.5px; font-weight: 600; color: #FF8A3D; background: rgba(255,138,61,0.14); padding: 2px 7px; border-radius: 999px">Default</span></sc-if></span>
          <span style="font-size: 12px; color: #9AA3B2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{a.summary}}</span>
        </span>
        <span style="{{a.dotStyle}}"></span>
        <span style="color: #9AA3B2">›</span>
      </a>
    </sc-for>
    <button style="margin-top: 6px; height: 50px; border-radius: 14px; border: 1px dashed #3A4150; background: none; color: #FF8A3D; font: inherit; font-size: 14px; font-weight: 600">+ Add a Claude account</button>
    <div style="font-size: 12px; color: #9AA3B2; line-height: 1.45; padding: 4px 2px">Tap an account for its usage, status and settings. New workspaces start on the default.</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dot = (c) => 'width: 8px; height: 8px; border-radius: 4px; flex-shrink: 0; background: ' + c;
    return { accounts: [
      { name: 'personal', initial: 'P', isDefault: true, summary: 'Max · 42% of 5-hour · 4 sessions', dotStyle: dot('#5BD69A') },
      { name: 'work', initial: 'W', isDefault: false, summary: 'Max · 8% of 5-hour · 1 session', dotStyle: dot('#5BD69A') },
      { name: 'side', initial: 'S', isDefault: false, summary: 'Pro · limit reached · resets 6:40 pm', dotStyle: dot('#F5B83D') }
    ]};
  }
}
</script>
</body>
</html>
