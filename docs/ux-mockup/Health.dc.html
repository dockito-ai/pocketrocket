<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Health</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0F1218; color: #E8EAF0; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 18px 12px 6px; display: flex; align-items: center; gap: 8px">
    <a href="Settings.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
    <div style="flex: 1; font-size: 17px; font-weight: 600">Health</div>
    <button style="height: 36px; padding: 0 12px; margin-right: 8px; border-radius: 10px; border: 1px solid #2A303C; background: none; color: #C9CFDA; font: inherit; font-size: 12px">Check again</button>
  </div>

  <div style="flex: 1; overflow: auto; padding: 6px 24px 20px; display: flex; flex-direction: column; gap: 20px">
    <div style="padding: 14px 16px; border-radius: 14px; background: #2A2416; border: 1px solid #5A4520; font-size: 13px; line-height: 1.45">
      <div style="font-weight: 600; color: #F5D48A">Sessions were stopped last night</div>
      <div style="color: #C9CFDA">Android stopped PocketRocket at 3:12 am (battery saver). 2 sessions paused. Fix the two items below to stop this.</div>
    </div>

    <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <div style="font-size: 11px; font-weight: 600; color: #9AA3B2; letter-spacing: 0.5px; padding-bottom: 2px">{{g.title}}</div>
        <sc-for list="{{g.items}}" as="i" hint-placeholder-count="3">
          <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; background: #161A22; border: 1px solid #232833">
            <span style="{{i.dot}}"></span>
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 500">{{i.name}}</span><span style="font-size: 12px; color: #9AA3B2">{{i.note}}</span></span>
            <sc-if value="{{i.fix}}" hint-placeholder-val="{{ false }}"><button style="flex-shrink: 0; height: 34px; padding: 0 12px; border-radius: 9px; border: 0; background: #F5B83D; color: #1A1206; font: inherit; font-size: 12px; font-weight: 600">{{i.fixLabel}}</button></sc-if>
          </div>
        </sc-for>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dot = (c) => 'width: 10px; height: 10px; border-radius: 5px; flex-shrink: 0; background: ' + c;
    const ok = (name, note) => ({ name, note, dot: dot('#5BD69A'), fix: false, fixLabel: '' });
    const bad = (name, note, fixLabel) => ({ name, note, dot: dot('#F5B83D'), fix: true, fixLabel });
    const check = (name, note) => ({ name, note, dot: dot('#9AA3B2'), fix: true, fixLabel: 'Show me' });
    return { groups: [
      { title: 'KEEPING SESSIONS ALIVE', items: [
        bad('Battery saver', 'Restricted. Set to No restrictions', 'Fix'),
        bad('Autostart', 'Off in Xiaomi settings', 'Fix'),
        ok('Ignore battery optimisation', 'Allowed'),
        ok('Background service', 'Running · 3 sessions'),
        ok('Wake lock', 'Held while a session is working'),
        ok('Android process limit', 'Lifted through wireless debugging'),
        check('Lock in recent apps', 'Can’t be checked automatically')
      ]},
      { title: 'PERMISSIONS', items: [
        ok('Notifications', 'On · Needs you and Finished channels'),
        ok('Microphone', 'Allowed for dictation'),
        ok('Files', 'Shared storage linked at ~/storage')
      ]},
      { title: 'SETUP', items: [
        ok('Claude Code', '2.1.312 · starts correctly'),
        ok('Tools', 'git, gh, node, npm, ripgrep · all found'),
        ok('Storage', '412 GB free'),
        ok('Network', 'downloads.claude.ai and github.com reachable')
      ]},
      { title: 'ACCOUNTS', items: [
        ok('Claude', '2 signed in'),
        ok('GitHub', '2 connected · keys accepted')
      ]}
    ]};
  }
}
</script>
</body>
</html>
