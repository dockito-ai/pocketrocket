<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GitHub accounts</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0F1218; color: #E8EAF0; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 18px 12px 6px; display: flex; align-items: center; gap: 8px">
    <a href="Settings.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
    <div style="font-size: 17px; font-weight: 600">GitHub accounts</div>
  </div>

  <div style="flex: 1; overflow: auto; padding: 10px 24px 20px; display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{accounts}}" as="a" hint-placeholder-count="2">
      <div style="{{a.cardStyle}}">
        <div style="display: flex; align-items: center; gap: 12px">
          <span style="width: 36px; height: 36px; border-radius: 18px; background: #2A303C; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg></span>
          <span style="flex: 1; min-width: 0; font-size: 15px; font-weight: 600">{{a.name}}</span>
          <sc-if value="{{a.isDefault}}" hint-placeholder-val="{{ false }}"><span style="font-size: 11px; font-weight: 600; color: #FF8A3D; background: rgba(255,138,61,0.14); padding: 4px 9px; border-radius: 999px">Default</span></sc-if>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px; font-size: 12px">
          <div style="display: flex; justify-content: space-between"><span style="color: #9AA3B2">Commits as</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px">{{a.identity}}</span></div>
          <div style="display: flex; justify-content: space-between"><span style="color: #9AA3B2">SSH key</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px">{{a.key}}</span></div>
          <div style="display: flex; justify-content: space-between"><span style="color: #9AA3B2">Used by</span><span>{{a.used}}</span></div>
        </div>
        <div style="display: flex; gap: 8px">
          <sc-if value="{{a.notDefault}}" hint-placeholder-val="{{ true }}"><button onClick="{{a.makeDefault}}" style="flex: 1; height: 40px; border-radius: 10px; border: 1px solid #2A303C; background: none; color: #E8EAF0; font: inherit; font-size: 13px">Make default</button></sc-if>
          <button style="flex: 1; height: 40px; border-radius: 10px; border: 1px solid #2A303C; background: none; color: #E8EAF0; font: inherit; font-size: 13px">Edit identity</button>
          <button style="flex: 1; height: 40px; border-radius: 10px; border: 1px solid #5A2A30; background: none; color: #FF8F8F; font: inherit; font-size: 13px">Remove</button>
        </div>
      </div>
    </sc-for>
    <button style="margin-top: 6px; height: 50px; border-radius: 14px; border: 1px dashed #3A4150; background: none; color: #FF8A3D; font: inherit; font-size: 14px; font-weight: 600">+ Connect a GitHub account</button>
    <div style="font-size: 12px; color: #9AA3B2; line-height: 1.45; padding: 4px 2px">Connecting creates a key on this phone, signs in to gh through GitHub's page, and adds the key to the account. Each workspace picks which account its repos use.</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { def: 'ShankarKakumani' }; }
  renderVals() {
    const accounts = [
      ['ShankarKakumani', 'Shankar Kakumani · noreply', 'ed25519 · pocketrocket-personal', '2 workspaces'],
      ['[work-handle]', '[work name] · [work email]', 'ed25519 · pocketrocket-work', '1 workspace']
    ].map(([name, identity, key, used]) => {
      const on = this.state.def === name;
      return { name, identity, key, used, isDefault: on, notDefault: !on, makeDefault: () => this.setState({ def: name }),
        cardStyle: 'display: flex; flex-direction: column; gap: 14px; padding: 16px; border-radius: 16px; background: #161A22; border: 1.5px solid ' + (on ? '#FF8A3D' : '#232833') };
    });
    return { accounts };
  }
}
</script>
</body>
</html>
