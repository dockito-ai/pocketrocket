<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Session controls</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #07090D; color: #E8EAF0; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden">
  <a href="Session.dc.html" style="flex: 1; display: flex; align-items: flex-start; justify-content: center; padding-top: 40px; font-size: 12px; color: #6B7383">Tap outside to close</a>
  <div style="background: #181C24; border-radius: 24px 24px 0 0; border-top: 1px solid #2A303C; padding: 10px 18px 22px; display: flex; flex-direction: column; gap: 18px">
    <div style="align-self: center; width: 40px; height: 4px; border-radius: 2px; background: #3A4150"></div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="font-size: 12px; font-weight: 600; color: #9AA3B2; letter-spacing: 0.4px">MODE</div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{modes}}" as="m" hint-placeholder-count="4">
          <button onClick="{{m.pick}}" style="{{m.style}}">
            <span style="font-size: 14px; font-weight: 600">{{m.name}}</span>
            <span style="font-size: 12px; color: #9AA3B2; line-height: 1.35">{{m.desc}}</span>
          </button>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="font-size: 12px; font-weight: 600; color: #9AA3B2; letter-spacing: 0.4px">MODEL</div>
      <div style="display: flex; gap: 8px">
        <sc-for list="{{models}}" as="o" hint-placeholder-count="3">
          <button onClick="{{o.pick}}" style="{{o.style}}">{{o.name}}</button>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; color: #9AA3B2; letter-spacing: 0.4px"><span>CONTEXT</span><span style="font-family: 'JetBrains Mono', monospace; font-weight: 400">160k of 1M</span></div>
      <div style="height: 8px; background: #2A303C; border-radius: 4px"><div style="width: 16%; height: 8px; background: #7AB4FF; border-radius: 4px"></div></div>
      <div style="display: flex; gap: 8px">
        <button style="flex: 1; height: 40px; border-radius: 10px; border: 1px solid #2A303C; background: none; color: #E8EAF0; font: inherit; font-size: 13px">Compact</button>
        <button style="flex: 1; height: 40px; border-radius: 10px; border: 1px solid #2A303C; background: none; color: #E8EAF0; font: inherit; font-size: 13px">Rewind…</button>
        <button style="flex: 1; height: 40px; border-radius: 10px; border: 1px solid #5A2A30; background: none; color: #FF8F8F; font: inherit; font-size: 13px">Stop</button>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="font-size: 12px; font-weight: 600; color: #9AA3B2; letter-spacing: 0.4px">COMMANDS</div>
      <div style="display: flex; flex-wrap: wrap; gap: 6px; font-family: 'JetBrains Mono', monospace; font-size: 12px">
        <span style="padding: 7px 10px; border-radius: 8px; background: #20252F">/review</span>
        <span style="padding: 7px 10px; border-radius: 8px; background: #20252F">/init</span>
        <span style="padding: 7px 10px; border-radius: 8px; background: #20252F">/memory</span>
        <span style="padding: 7px 10px; border-radius: 8px; background: #20252F">/agents</span>
        <span style="padding: 7px 10px; border-radius: 8px; background: #20252F">/mcp</span>
        <span style="padding: 7px 10px; border-radius: 8px; background: #20252F; color: #9AA3B2">your skills…</span>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { mode: 'Accept edits', model: 'Opus 5.5' }; }
  renderVals() {
    const modes = [
      ['Manual', 'Asks before every edit and command'],
      ['Accept edits', 'Edits freely, asks before commands'],
      ['Plan', 'Reads and plans, changes nothing until you approve'],
      ['Auto', 'Runs on its own, asks only for risky actions']
    ].map(([name, desc]) => {
      const on = this.state.mode === name;
      return { name, desc, pick: () => this.setState({ mode: name }),
        style: 'display: flex; flex-direction: column; align-items: flex-start; gap: 4px; text-align: left; padding: 12px; border-radius: 12px; font: inherit; color: #E8EAF0; cursor: pointer; background: ' + (on ? 'rgba(255,138,61,0.12)' : '#0F1218') + '; border: 1.5px solid ' + (on ? '#FF8A3D' : '#2A303C') };
    });
    const models = ['Opus 5.5', 'Sonnet 5.5', 'Haiku 5.5'].map((name) => {
      const on = this.state.model === name;
      return { name, pick: () => this.setState({ model: name }),
        style: 'flex: 1; height: 44px; border-radius: 10px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; color: ' + (on ? '#1A1206' : '#E8EAF0') + '; background: ' + (on ? '#FF8A3D' : '#0F1218') + '; border: 1px solid ' + (on ? '#FF8A3D' : '#2A303C') };
    });
    return { modes, models };
  }
}
</script>
</body>
</html>
